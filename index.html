<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#7b1fdb">
<meta name="description" content="First-person 3D Flappy Bird. Tap to fly.">
<title>Flappy FPV</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' fill='%237b1fdb'/><rect x='8' y='4' width='16' height='9' fill='%2356d62e'/><rect x='8' y='19' width='16' height='9' fill='%2356d62e'/></svg>">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;overflow:hidden;background:#2a0752}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",sans-serif;
    -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;
    touch-action:none;overscroll-behavior:none;
  }
  #game{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}

  /* ---- top score, the only in-game readout ---- */
  #hud{
    position:fixed;top:calc(env(safe-area-inset-top) + 22px);left:0;right:0;
    text-align:center;pointer-events:none;opacity:0;transition:opacity .3s ease;
  }
  #hud.show{opacity:1}
  #score{
    display:inline-block;font-size:clamp(58px,17vw,104px);font-weight:900;line-height:1;
    letter-spacing:-.045em;color:#fff;
    text-shadow:0 0 34px rgba(255,255,255,.5),0 0 12px rgba(255,255,255,.35),0 6px 0 rgba(0,0,0,.22);
    transform-origin:50% 50%;transition:transform .13s cubic-bezier(.2,.9,.3,1.6);
  }
  #score.pop{transform:scale(1.18)}
  #zone{
    margin-top:6px;font-size:12px;font-weight:800;letter-spacing:.34em;text-transform:uppercase;
    color:#fff;opacity:0;transition:opacity .5s ease;
    text-shadow:0 0 18px rgba(0,0,0,.7),0 2px 10px rgba(0,0,0,.85);
  }
  #zone.show{opacity:.95}

  /* ---- overlays ---- */
  #ui{
    position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
    pointer-events:none;text-align:center;
    padding:calc(env(safe-area-inset-top) + 20px) 22px calc(env(safe-area-inset-bottom) + 20px);
  }
  .card{
    position:absolute;opacity:0;transform:translateY(14px) scale(.94);
    transition:opacity .28s ease,transform .28s cubic-bezier(.2,.9,.3,1.5);
    padding:36px 40px 40px;border-radius:32px;
    background:linear-gradient(180deg,rgba(14,2,34,.82),rgba(8,1,22,.9));
    border:1px solid rgba(255,255,255,.13);
    box-shadow:0 30px 80px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.1);
  }
  .card.show{opacity:1;transform:none}
  h1{
    font-size:clamp(40px,13vw,74px);line-height:.88;font-weight:900;letter-spacing:-.045em;color:#fff;
    text-shadow:0 0 34px rgba(255,255,255,.3),0 6px 0 rgba(0,0,0,.3);
  }
  h1 em{display:block;font-style:normal;color:#8bff5a;text-shadow:0 0 34px rgba(140,255,90,.6),0 6px 0 rgba(0,0,0,.3)}
  .rule{width:52px;height:4px;border-radius:4px;background:#8bff5a;margin:20px auto 0;opacity:.9}
  .sub{
    margin-top:20px;font-size:13px;font-weight:800;letter-spacing:.28em;
    color:rgba(255,255,255,.9);text-transform:uppercase;
  }
  .blink{animation:blink 1.3s ease-in-out infinite}
  @keyframes blink{0%,100%{opacity:1}50%{opacity:.3}}
  .scores{margin-top:26px;display:flex;gap:14px;justify-content:center}
  .scores div{
    flex:1;min-width:104px;padding:16px 10px 14px;border-radius:18px;
    background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.09);color:#fff;
  }
  .scores b{display:block;font-size:40px;font-weight:900;line-height:1;letter-spacing:-.03em}
  .scores i{display:block;margin-top:8px;font-style:normal;font-size:10px;letter-spacing:.24em;opacity:.62;text-transform:uppercase}
  .scores .hi b{color:#8bff5a}
</style>
</head>
<body>
<canvas id="game"></canvas>

<div id="hud"><div id="score">0</div><div id="zone"></div></div>

<div id="ui">
  <div class="card" id="cardStart">
    <h1>FLAPPY<em>FPV</em></h1>
    <div class="rule"></div>
    <p class="sub blink">Tap to fly</p>
  </div>
  <div class="card" id="cardOver">
    <h1 style="color:#ff5f5f;text-shadow:0 0 34px rgba(255,95,95,.45),0 6px 0 rgba(0,0,0,.3)">GAME<br>OVER</h1>
    <div class="scores">
      <div><b id="sFinal">0</b><i>Score</i></div>
      <div class="hi"><b id="sBest">0</b><i>Best</i></div>
    </div>
    <p class="sub blink" style="margin-top:28px">Tap to retry</p>
  </div>
</div>

<script>
(() => {
"use strict";

/* ---------------------------------------------------------------- setup */
const cv = document.getElementById('game');
const ctx = cv.getContext('2d');
const hud = document.getElementById('hud');
const elScore = document.getElementById('score');
const elZone = document.getElementById('zone');
const cardStart = document.getElementById('cardStart');
const cardOver = document.getElementById('cardOver');
const sFinal = document.getElementById('sFinal');
const sBest = document.getElementById('sBest');

let W = 0, H = 0, cx = 0, cy = 0, focal = 0;
const FOV = 68 * Math.PI / 180;

function resize() {
  const dpr = Math.min(window.devicePixelRatio || 1, 2.5);
  W = window.innerWidth; H = window.innerHeight;
  cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
  cv.style.width = W + 'px'; cv.style.height = H + 'px';
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  cx = W / 2; cy = H / 2;
  focal = (H / 2) / Math.tan(FOV / 2);
}
window.addEventListener('resize', resize);
resize();

/* ---------------------------------------------------------------- world */
const FLOOR = -6, CEIL = 6;          // corridor, also the kill planes
const HALF_W = 9.5;                  // floor / ceiling half width
const PIPE_W = 2.9, PIPE_D = 2.9;
const CAP_H = 0.75, CAP_OUT = 0.42;  // pipe lip
const GAP = 4.6;
const SPACING = 13;
const SPAWN_Z = 78;
const RADIUS = 0.32;
const GRAVITY = -21, FLAP = 7.1, MAX_FALL = -16;
const BASE_SPEED = 9.5;              // pipes per second ≈ BASE_SPEED / SPACING

const cam = { x: 0, y: 0, z: 0, vy: 0, pitch: 0, roll: 0 };
let pipes = [], stars = [], towers = [];
let speed = BASE_SPEED, score = 0, best = 0, shake = 0;
let state = 'start';
let t = 0, lastTs = 0, deadAt = -9, shownScore = -1, zoneIdx = -1;

try { best = parseInt(localStorage.getItem('flappyFpvBest') || '0', 10) || 0; } catch (e) { best = 0; }

/* ---------------------------------------------------------------- zones
   The scenery evolves with the score: every ZONE_LEN points the world
   crosses into the next palette, and the live colours ease toward it. */
const ZONE_LEN = 8;
const ZONES = [
  { name: 'Neon',    sky: [[143, 52, 242], [123, 31, 219], [88, 18, 160]],   void: [123, 31, 219],  floor: [86, 214, 46],   pipe: [86, 214, 46],   lip: [128, 236, 78],  tower: [78, 16, 148] },
  { name: 'Sunset',  sky: [[255, 158, 92], [242, 92, 112], [126, 38, 116]],  void: [240, 104, 116], floor: [34, 168, 156],  pipe: [40, 196, 178],  lip: [96, 236, 216],  tower: [148, 46, 92] },
  { name: 'Abyss',   sky: [[36, 86, 176], [16, 44, 118], [6, 16, 58]],       void: [18, 48, 120],   floor: [26, 82, 146],   pipe: [255, 118, 86],  lip: [255, 170, 128], tower: [10, 30, 84] },
  { name: 'Toxic',   sky: [[74, 106, 42], [38, 62, 28], [12, 24, 14]],       void: [40, 66, 30],    floor: [104, 138, 38],  pipe: [216, 238, 44],  lip: [242, 252, 128], tower: [26, 46, 22] },
  { name: 'Glacier', sky: [[84, 126, 196], [42, 74, 138], [14, 28, 66]],     void: [46, 80, 144],   floor: [148, 196, 232], pipe: [230, 246, 255], lip: [255, 255, 255], tower: [26, 50, 104] },
  { name: 'Ember',   sky: [[92, 22, 26], [48, 12, 20], [16, 5, 10]],         void: [52, 14, 20],    floor: [124, 44, 30],   pipe: [255, 92, 52],   lip: [255, 156, 100], tower: [34, 9, 14] }
];

// live palette, eased toward ZONES[zone] every frame
const P = {
  sky: [[143, 52, 242], [123, 31, 219], [88, 18, 160]],
  void: [123, 31, 219], floor: [86, 214, 46], pipe: [86, 214, 46],
  lip: [128, 236, 78], tower: [78, 16, 148]
};

function easeArr(a, b, k) { for (let i = 0; i < a.length; i++) a[i] += (b[i] - a[i]) * k; }
function easeZone(dt) {
  const z = ZONES[Math.floor(score / ZONE_LEN) % ZONES.length];
  const k = Math.min(1, dt * 1.6);
  for (let i = 0; i < 3; i++) easeArr(P.sky[i], z.sky[i], k);
  easeArr(P.void, z.void, k);
  easeArr(P.floor, z.floor, k);
  easeArr(P.pipe, z.pipe, k);
  easeArr(P.lip, z.lip, k);
  easeArr(P.tower, z.tower, k);
}
function snapZone() {
  const z = ZONES[Math.floor(score / ZONE_LEN) % ZONES.length];
  for (let i = 0; i < 3; i++) P.sky[i] = z.sky[i].slice();
  P.void = z.void.slice(); P.floor = z.floor.slice(); P.pipe = z.pipe.slice();
  P.lip = z.lip.slice(); P.tower = z.tower.slice();
}

function makeStars() {
  stars = [];
  for (let i = 0; i < 90; i++) {
    stars.push({
      x: (Math.random() - .5) * 30,
      y: FLOOR + Math.random() * (CEIL - FLOOR),
      z: cam.z + Math.random() * SPAWN_Z,
      s: 0.05 + Math.random() * 0.09
    });
  }
}

/* Silhouettes standing out in the void, past the edge of the corridor. */
function seedTower(tw, z) {
  const side = Math.random() < .5 ? -1 : 1;
  tw.x = side * (12 + Math.random() * 15);
  tw.w = 2 + Math.random() * 4;
  tw.d = 2 + Math.random() * 4;
  tw.h = 5 + Math.random() * 22;
  tw.z = z;
  return tw;
}
function makeTowers() {
  towers = [];
  for (let i = 0; i < 22; i++) towers.push(seedTower({}, cam.z + Math.random() * (SPAWN_Z + 20)));
}

let lastGapY = 0;
/* Gaps drift rather than teleport: a new gap stays within reach of the
   previous one, so a run is always physically flyable. */
function addPipe(z) {
  const span = (CEIL - FLOOR - GAP) / 2 - 0.9;
  let y = lastGapY + (Math.random() * 2 - 1) * 2.2;
  if (y > span || y < -span) y = lastGapY - (y - lastGapY);
  lastGapY = Math.max(-span, Math.min(span, y));
  pipes.push({ z, gapY: lastGapY, scored: false });
}

function reset() {
  cam.x = 0; cam.y = 0; cam.z = 0; cam.vy = 0; cam.pitch = 0; cam.roll = 0;
  pipes = []; score = 0; speed = BASE_SPEED; shake = 0; lastGapY = 0;
  for (let i = 0; i < 6; i++) addPipe(30 + i * SPACING);
  makeStars(); makeTowers(); snapZone();
  zoneIdx = 0; shownScore = -1;
}

/* ------------------------------------------------------------ 3d helpers */
const NEAR = 0.25;

function toCam(x, y, z) {
  const dx = x - cam.x, dy = y - cam.y, dz = z - cam.z;
  const cp = Math.cos(cam.pitch), sp = Math.sin(cam.pitch);
  const zr = dz * cp + dy * sp;
  let   yr = dy * cp - dz * sp;
  const cr = Math.cos(cam.roll), sr = Math.sin(cam.roll);
  const xr = dx * cr - yr * sr;
  yr = dx * sr + yr * cr;
  return { x: xr, y: yr, z: zr };
}

function clipNear(poly) {
  const out = [];
  for (let i = 0; i < poly.length; i++) {
    const a = poly[i], b = poly[(i + 1) % poly.length];
    const ain = a.z >= NEAR, bin = b.z >= NEAR;
    if (ain) out.push(a);
    if (ain !== bin) {
      const k = (NEAR - a.z) / (b.z - a.z);
      out.push({ x: a.x + (b.x - a.x) * k, y: a.y + (b.y - a.y) * k, z: NEAR });
    }
  }
  return out;
}

function path(poly) {
  const p = clipNear(poly);
  if (p.length < 3) return false;
  ctx.beginPath();
  for (let i = 0; i < p.length; i++) {
    const sx = cx + focal * p[i].x / p[i].z;
    const sy = cy - focal * p[i].y / p[i].z;
    i ? ctx.lineTo(sx, sy) : ctx.moveTo(sx, sy);
  }
  ctx.closePath();
  return true;
}

/* --------------------------------------------------------------- colours */
const fogStart = 24, fogEnd = 72;      // pipes
const SLAB_FOG  = [0.55, 15, 36];      // [strength, start, end] floor / ceiling
const TOWER_FOG = [0.92, 10, 70];

/* fog lets the corridor dissolve into the void while the pipes, which need
   to stay readable, keep their colour much longer. */
function shade(rgb, mul, z, fog) {
  const fs = fog ? fog[1] : fogStart, fe = fog ? fog[2] : fogEnd;
  const f = Math.max(0, Math.min(1, (z - fs) / (fe - fs))) * (fog ? fog[0] : 0.3);
  const v = P.void;
  const r = rgb[0] * mul * (1 - f) + v[0] * f;
  const g = rgb[1] * mul * (1 - f) + v[1] * f;
  const b = rgb[2] * mul * (1 - f) + v[2] * f;
  return 'rgb(' + (r | 0) + ',' + (g | 0) + ',' + (b | 0) + ')';
}
const css = rgb => 'rgb(' + (rgb[0] | 0) + ',' + (rgb[1] | 0) + ',' + (rgb[2] | 0) + ')';

const FACE = { front: 1.0, back: .66, left: .74, right: .82, top: 1.22, bottom: .52 };

/* Axis-aligned box, back-face culled. */
function box(x0, x1, y0, y1, z0, z1, rgb, fog, outline) {
  const V = [
    [x0, y0, z0], [x1, y0, z0], [x1, y1, z0], [x0, y1, z0],
    [x0, y0, z1], [x1, y0, z1], [x1, y1, z1], [x0, y1, z1]
  ].map(v => toCam(v[0], v[1], v[2]));

  const faces = [
    { i: [0, 1, 2, 3], k: 'front',  vis: cam.z < z0, z: z0 },
    { i: [5, 4, 7, 6], k: 'back',   vis: cam.z > z1, z: z1 },
    { i: [4, 0, 3, 7], k: 'left',   vis: cam.x < x0, z: (z0 + z1) / 2 },
    { i: [1, 5, 6, 2], k: 'right',  vis: cam.x > x1, z: (z0 + z1) / 2 },
    { i: [3, 2, 6, 7], k: 'top',    vis: cam.y > y1, z: (z0 + z1) / 2 },
    { i: [4, 5, 1, 0], k: 'bottom', vis: cam.y < y0, z: (z0 + z1) / 2 }
  ];

  for (const f of faces) {
    if (!f.vis) continue;
    if (!path(f.i.map(n => V[n]))) continue;
    const d = Math.max(NEAR, f.z - cam.z);
    ctx.fillStyle = shade(rgb, FACE[f.k], d, fog);
    ctx.fill();
    if (outline !== false) {
      ctx.strokeStyle = shade(rgb, FACE[f.k] * .72, d, fog);
      ctx.lineWidth = 1;
      ctx.stroke();
    }
  }
}

function drawPipe(p) {
  const gapB = p.gapY - GAP / 2, gapT = p.gapY + GAP / 2;
  const x0 = -PIPE_W / 2, x1 = PIPE_W / 2;
  const z0 = p.z - PIPE_D / 2, z1 = p.z + PIPE_D / 2;
  const cx0 = x0 - CAP_OUT, cx1 = x1 + CAP_OUT;
  const cz0 = z0 - CAP_OUT, cz1 = z1 + CAP_OUT;

  box(x0, x1, FLOOR, gapB - CAP_H, z0, z1, P.pipe);      // bottom body
  box(x0, x1, gapT + CAP_H, CEIL, z0, z1, P.pipe);       // top body
  box(cx0, cx1, gapB - CAP_H, gapB, cz0, cz1, P.lip);    // bottom lip
  box(cx0, cx1, gapT, gapT + CAP_H, cz0, cz1, P.lip);    // top lip
}

/* -------------------------------------------------------------- scenery */
function drawSky() {
  const g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, css(P.sky[0]));
  g.addColorStop(.5, css(P.sky[1]));
  g.addColorStop(1, css(P.sky[2]));
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, H);
}

/* Slabs are drawn as depth strips so the fog is computed per-distance
   instead of as a flat screen-space gradient. */
function drawSlab(y, rgb, mul) {
  const near = -8, far = SLAB_FOG[2], segs = 26;
  for (let i = segs - 1; i >= 0; i--) {
    const z0 = cam.z + near + (far - near) * (i / segs);
    const z1 = cam.z + near + (far - near) * ((i + 1) / segs) + 0.15;
    if (!path([toCam(-HALF_W, y, z0), toCam(HALF_W, y, z0),
               toCam(HALF_W, y, z1), toCam(-HALF_W, y, z1)])) continue;
    ctx.fillStyle = shade(rgb, mul, Math.max(NEAR, (z0 + z1) / 2 - cam.z), SLAB_FOG);
    ctx.fill();
  }
}

function drawTowers() {
  const sorted = towers.slice().sort((a, b) => b.z - a.z);
  for (const w of sorted) {
    if (w.z - cam.z < NEAR) continue;
    box(w.x - w.w / 2, w.x + w.w / 2, FLOOR - 9, FLOOR - 9 + w.h,
        w.z - w.d / 2, w.z + w.d / 2, P.tower, TOWER_FOG, false);
  }
}

function drawGrid() {
  ctx.lineWidth = 1;
  const off = ((cam.z % 4) + 4) % 4;
  for (let i = 0; i < 20; i++) {
    const z = i * 4 - off + cam.z;
    const d = z - cam.z;
    if (d < NEAR) continue;
    const a = 0.16 * Math.max(0, 1 - d / SLAB_FOG[2]);
    if (a <= 0.01) continue;
    ctx.strokeStyle = 'rgba(255,255,255,' + a.toFixed(3) + ')';
    for (const y of [FLOOR + .02, CEIL - .02]) {
      if (path([toCam(-HALF_W, y, z), toCam(HALF_W, y, z),
                toCam(HALF_W, y, z + .06), toCam(-HALF_W, y, z + .06)])) ctx.stroke();
    }
  }
  for (let i = -6; i <= 6; i++) {
    const x = i * 2.2;
    ctx.strokeStyle = 'rgba(255,255,255,0.07)';
    for (const y of [FLOOR + .02, CEIL - .02]) {
      if (path([toCam(x, y, cam.z + NEAR + .1), toCam(x + .05, y, cam.z + NEAR + .1),
                toCam(x + .05, y, cam.z + SLAB_FOG[2]), toCam(x, y, cam.z + SLAB_FOG[2])])) ctx.stroke();
    }
  }
}

function drawStars() {
  for (const s of stars) {
    const c = toCam(s.x, s.y, s.z);
    if (c.z < 5) continue;
    const sx = cx + focal * c.x / c.z, sy = cy - focal * c.y / c.z;
    const sz = Math.min(7, Math.max(1, focal * s.s / c.z));
    const fade = Math.min(1, (c.z - 5) / 6) * (1 - c.z / (SPAWN_Z + 20));
    ctx.fillStyle = 'rgba(255,255,255,' + Math.max(0, 0.7 * fade).toFixed(3) + ')';
    ctx.fillRect(sx - sz / 2, sy - sz / 2, sz, sz);
  }
}

/* ----------------------------------------------------------------- audio */
let ac = null;
function beep(freq, dur, type, vol) {
  try {
    if (!ac) ac = new (window.AudioContext || window.webkitAudioContext)();
    if (ac.state === 'suspended') ac.resume();
    const o = ac.createOscillator(), g = ac.createGain();
    o.type = type || 'square';
    o.frequency.setValueAtTime(freq, ac.currentTime);
    o.frequency.exponentialRampToValueAtTime(freq * .6, ac.currentTime + dur);
    g.gain.setValueAtTime(vol || .05, ac.currentTime);
    g.gain.exponentialRampToValueAtTime(.0001, ac.currentTime + dur);
    o.connect(g); g.connect(ac.destination);
    o.start(); o.stop(ac.currentTime + dur);
  } catch (e) { /* audio is optional */ }
}

/* ------------------------------------------------------------------ loop */
function flap() {
  if (state === 'start') {
    state = 'play';
    cardStart.classList.remove('show');
    hud.classList.add('show');
  }
  if (state === 'dead') {
    if (t - deadAt < .55) return;   // ignore the tap that killed you
    reset();
    state = 'play';
    cardOver.classList.remove('show');
    hud.classList.add('show');
    return;
  }
  cam.vy = FLAP;
  cam.roll = (Math.random() - .5) * .12;
  beep(520, .09, 'square', .045);
}

function die() {
  state = 'dead'; deadAt = t; shake = 1;
  beep(160, .35, 'sawtooth', .07);
  if (score > best) {
    best = score;
    try { localStorage.setItem('flappyFpvBest', String(best)); } catch (e) { /* ignore */ }
  }
  sFinal.textContent = score;
  sBest.textContent = best;
  hud.classList.remove('show');
  elZone.classList.remove('show');
  cardOver.classList.add('show');
}

function update(dt) {
  t += dt;

  if (state === 'start') {
    cam.y = Math.sin(t * 1.6) * .45;
    cam.pitch = Math.sin(t * 1.6) * .05;
    cam.z += 2.6 * dt;
  } else if (state === 'play') {
    speed = BASE_SPEED + Math.min(score * .09, 4.5);
    cam.vy = Math.max(MAX_FALL, cam.vy + GRAVITY * dt);
    cam.y += cam.vy * dt;
    cam.z += speed * dt;

    if (cam.y - RADIUS < FLOOR || cam.y + RADIUS > CEIL) {
      cam.y = Math.max(FLOOR + RADIUS, Math.min(CEIL - RADIUS, cam.y));
      die();
    }
    for (const p of pipes) {
      const half = PIPE_D / 2 + CAP_OUT + RADIUS;
      if (Math.abs(p.z - cam.z) < half) {
        if (cam.y - RADIUS < p.gapY - GAP / 2 || cam.y + RADIUS > p.gapY + GAP / 2) { die(); break; }
      }
      if (!p.scored && p.z < cam.z) {
        p.scored = true; score++;
        beep(880, .08, 'triangle', .05);
      }
    }
  } else {
    cam.vy = Math.max(MAX_FALL, cam.vy + GRAVITY * 1.4 * dt);
    cam.y = Math.max(FLOOR + 0.9, cam.y + cam.vy * dt);
    shake = Math.max(0, shake - dt * 2.5);
  }

  easeZone(dt);

  // once dead, level the view back up so the crash still shows the corridor
  const wantPitch = state === 'play' ? Math.max(-.34, Math.min(.26, cam.vy * .03))
                  : state === 'dead' ? .12 : cam.pitch;
  cam.pitch += (wantPitch - cam.pitch) * Math.min(1, dt * 9);
  cam.roll += (0 - cam.roll) * Math.min(1, dt * 5);

  // recycle
  pipes = pipes.filter(p => p.z > cam.z - 8);
  let far = cam.z;
  for (const p of pipes) far = Math.max(far, p.z);
  while (far < cam.z + SPAWN_Z) { far += SPACING; addPipe(far); }

  for (const s of stars) {
    if (s.z < cam.z - 3) {
      s.z = cam.z + SPAWN_Z + Math.random() * 12;
      s.x = (Math.random() - .5) * 30;
      s.y = FLOOR + Math.random() * (CEIL - FLOOR);
    }
  }
  for (const w of towers) if (w.z < cam.z - 6) seedTower(w, cam.z + SPAWN_Z + Math.random() * 20);
}

function syncHud() {
  if (score !== shownScore) {
    shownScore = score;
    elScore.textContent = score;
    elScore.classList.add('pop');
    setTimeout(() => elScore.classList.remove('pop'), 130);

    const zi = Math.floor(score / ZONE_LEN) % ZONES.length;
    if (zi !== zoneIdx) {
      zoneIdx = zi;
      elZone.textContent = ZONES[zi].name;
      elZone.classList.add('show');
      setTimeout(() => elZone.classList.remove('show'), 2600);
    }
  }
}

function render() {
  ctx.save();
  if (shake > 0) ctx.translate((Math.random() - .5) * 14 * shake, (Math.random() - .5) * 14 * shake);

  drawSky();
  drawTowers();
  drawSlab(CEIL, P.floor, .62);
  drawSlab(FLOOR, P.floor, 1.05);
  drawGrid();
  drawStars();

  const sorted = pipes.slice().sort((a, b) => b.z - a.z);
  for (const p of sorted) drawPipe(p);

  const v = ctx.createRadialGradient(cx, cy, H * .3, cx, cy, H * .78);
  v.addColorStop(0, 'rgba(0,0,0,0)');
  v.addColorStop(1, 'rgba(0,0,0,.42)');
  ctx.fillStyle = v;
  ctx.fillRect(-40, -40, W + 80, H + 80);
  ctx.restore();

  // dim behind the overlays so a card reads against any palette
  const dim = state === 'dead' ? Math.min(.5, (t - deadAt) * 1.6)
            : state === 'start' ? .3 : 0;
  if (dim > 0) {
    ctx.fillStyle = 'rgba(6,2,14,' + dim.toFixed(3) + ')';
    ctx.fillRect(0, 0, W, H);
  }

  syncHud();
}

function frame(ts) {
  const dt = Math.min(.05, (ts - lastTs) / 1000 || 0);
  lastTs = ts;
  update(dt);
  render();
  requestAnimationFrame(frame);
}

/* ---------------------------------------------------------------- input */
cv.addEventListener('pointerdown', e => { e.preventDefault(); flap(); });
document.addEventListener('touchstart', e => e.preventDefault(), { passive: false });
window.addEventListener('keydown', e => {
  if (e.code === 'Space' || e.code === 'ArrowUp' || e.code === 'Enter') { e.preventDefault(); flap(); }
});

reset();
sBest.textContent = best;
cardStart.classList.add('show');
requestAnimationFrame(ts => { lastTs = ts; requestAnimationFrame(frame); });
})();
</script>
</body>
</html>
