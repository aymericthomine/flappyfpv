<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#7b1fdb">
<meta name="description" content="Flappy Bird en 3D, vue première personne. Tape pour voler.">
<title>Flappy FPV</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' fill='%237b1fdb'/><rect x='8' y='4' width='16' height='9' fill='%2356d62e'/><rect x='8' y='19' width='16' height='9' fill='%2356d62e'/></svg>">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;overflow:hidden;background:#3d0a70}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;
    touch-action:none;overscroll-behavior:none;
  }
  #game{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
  #ui{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
      pointer-events:none;text-align:center;padding:env(safe-area-inset-top) 24px env(safe-area-inset-bottom)}
  .card{
    pointer-events:none;opacity:0;transform:translateY(10px) scale(.96);
    transition:opacity .25s ease,transform .25s cubic-bezier(.2,.9,.3,1.4);
    padding:30px 34px 34px;border-radius:28px;
    background:rgba(18,0,42,.74);box-shadow:0 20px 60px rgba(0,0,0,.35);
  }
  .card.show{opacity:1;transform:none}
  h1{
    font-size:clamp(34px,11vw,64px);line-height:.92;font-weight:900;letter-spacing:-.03em;color:#fff;
    text-shadow:0 0 24px rgba(120,255,90,.55),0 6px 0 rgba(0,0,0,.35);
  }
  h1 span{display:block;color:#8bff5a}
  .sub{margin-top:14px;font-size:15px;font-weight:700;letter-spacing:.22em;color:rgba(255,255,255,.85);text-transform:uppercase}
  .blink{animation:blink 1.1s infinite}
  @keyframes blink{0%,100%{opacity:1}50%{opacity:.25}}
  .scores{margin-top:22px;display:flex;gap:34px;justify-content:center}
  .scores div{color:#fff}
  .scores b{display:block;font-size:44px;font-weight:900;line-height:1;text-shadow:0 4px 0 rgba(0,0,0,.3)}
  .scores i{display:block;margin-top:6px;font-style:normal;font-size:11px;letter-spacing:.2em;opacity:.7;text-transform:uppercase}
  #hud{position:fixed;top:calc(env(safe-area-inset-top) + 14px);left:0;right:0;text-align:center;
       color:#fff;font-size:13px;font-weight:800;letter-spacing:.22em;opacity:.55;pointer-events:none}
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="hud"></div>
<div id="ui">
  <div class="card" id="cardStart">
    <h1>FLAPPY<span>FPV</span></h1>
    <p class="sub blink">Tape pour voler</p>
  </div>
  <div class="card" id="cardOver">
    <h1 style="color:#ff5a5a;text-shadow:0 0 24px rgba(255,90,90,.5),0 6px 0 rgba(0,0,0,.35)">PERDU</h1>
    <div class="scores">
      <div><b id="sFinal">0</b><i>Score</i></div>
      <div><b id="sBest">0</b><i>Record</i></div>
    </div>
    <p class="sub blink" style="margin-top:26px">Tape pour rejouer</p>
  </div>
</div>

<script>
(() => {
"use strict";

/* ---------------------------------------------------------------- setup */
const cv = document.getElementById('game');
const ctx = cv.getContext('2d');
const hud = document.getElementById('hud');
const cardStart = document.getElementById('cardStart');
const cardOver  = document.getElementById('cardOver');
const sFinal = document.getElementById('sFinal');
const sBest  = document.getElementById('sBest');

let W = 0, H = 0, cx = 0, cy = 0, focal = 0;
const FOV = 68 * Math.PI / 180;

function resize() {
  const dpr = Math.min(window.devicePixelRatio || 1, 2.5);
  W = window.innerWidth; H = window.innerHeight;
  cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
  cv.style.width = W + 'px'; cv.style.height = H + 'px';
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  cx = W / 2; cy = H / 2;
  focal = (H / 2) / Math.tan(FOV / 2);
}
window.addEventListener('resize', resize);
resize();

/* ---------------------------------------------------------------- world */
const FLOOR = -6, CEIL = 6;          // corridor
const HALF_W = 9.5;                   // floor / ceiling half width
const PIPE_W = 2.9, PIPE_D = 2.9;    // pipe body
const CAP_H = 0.75, CAP_OUT = 0.42;  // pipe lip
const GAP = 4.6;                     // vertical gap
const SPACING = 13;                  // z distance between pipes
const SPAWN_Z = 78;                  // where pipes appear
const RADIUS = 0.32;                 // player collision radius
const GRAVITY = -24, FLAP = 7.6, MAX_FALL = -18;

const cam = { x: 0, y: 0, z: 0, vy: 0, pitch: 0, roll: 0 };
let pipes = [], stars = [], speed = 12, score = 0, best = 0, shake = 0;
let state = 'start';       // start | play | dead
let t = 0, lastTs = 0;

try { best = parseInt(localStorage.getItem('flappyFpvBest') || '0', 10) || 0; } catch (e) { best = 0; }

function makeStars() {
  stars = [];
  for (let i = 0; i < 90; i++) {
    stars.push({
      x: (Math.random() - .5) * 30,
      y: FLOOR + Math.random() * (CEIL - FLOOR),
      z: Math.random() * SPAWN_Z,
      s: 0.05 + Math.random() * 0.09
    });
  }
}

function reset() {
  cam.x = 0; cam.y = 0; cam.z = 0; cam.vy = 0; cam.pitch = 0; cam.roll = 0;
  pipes = []; score = 0; speed = 12; shake = 0; lastGapY = 0;
  for (let i = 0; i < 6; i++) addPipe(28 + i * SPACING);
  makeStars();
}

/* Gaps drift rather than teleport: a new gap stays within reach of the
   previous one, so a run is always physically flyable. */
let lastGapY = 0;
function addPipe(z) {
  const span = (CEIL - FLOOR - GAP) / 2 - 0.9;
  let y = lastGapY + (Math.random() * 2 - 1) * 2.2;
  if (y > span || y < -span) y = lastGapY - (y - lastGapY);
  lastGapY = Math.max(-span, Math.min(span, y));
  pipes.push({ z, gapY: lastGapY, scored: false });
}

/* ------------------------------------------------------------ 3d helpers */
const NEAR = 0.25;

function toCam(x, y, z) {
  const dx = x - cam.x, dy = y - cam.y, dz = z - cam.z;
  const cp = Math.cos(cam.pitch), sp = Math.sin(cam.pitch);
  const zr =  dz * cp + dy * sp;
  let   yr =  dy * cp - dz * sp;
  const cr = Math.cos(cam.roll), sr = Math.sin(cam.roll);
  const xr = dx * cr - yr * sr;
  yr = dx * sr + yr * cr;
  return { x: xr, y: yr, z: zr };
}

function clipNear(poly) {
  const out = [];
  for (let i = 0; i < poly.length; i++) {
    const a = poly[i], b = poly[(i + 1) % poly.length];
    const ain = a.z >= NEAR, bin = b.z >= NEAR;
    if (ain) out.push(a);
    if (ain !== bin) {
      const k = (NEAR - a.z) / (b.z - a.z);
      out.push({ x: a.x + (b.x - a.x) * k, y: a.y + (b.y - a.y) * k, z: NEAR });
    }
  }
  return out;
}

function path(poly) {
  const p = clipNear(poly);
  if (p.length < 3) return false;
  ctx.beginPath();
  for (let i = 0; i < p.length; i++) {
    const sx = cx + focal * p[i].x / p[i].z;
    const sy = cy - focal * p[i].y / p[i].z;
    i ? ctx.lineTo(sx, sy) : ctx.moveTo(sx, sy);
  }
  ctx.closePath();
  return true;
}

/* --------------------------------------------------------------- colours */
const BG = [123, 31, 219];
const fogStart = 24, fogEnd = 72;      // pipes
const SLAB_FOG = [0.55, 15, 36];       // [strength, start, end] for floor/ceiling

/* fogMul lets the corridor dissolve into the void while the pipes,
   which need to stay readable, keep their colour much longer. */
function shade(rgb, mul, z, fog) {
  const fs = fog ? fog[1] : fogStart, fe = fog ? fog[2] : fogEnd;
  const f = Math.max(0, Math.min(1, (z - fs) / (fe - fs))) * (fog ? fog[0] : 0.3);
  const r = rgb[0] * mul * (1 - f) + BG[0] * f;
  const g = rgb[1] * mul * (1 - f) + BG[1] * f;
  const b = rgb[2] * mul * (1 - f) + BG[2] * f;
  return 'rgb(' + (r | 0) + ',' + (g | 0) + ',' + (b | 0) + ')';
}

const GREEN = [86, 214, 46];
const LIME  = [128, 236, 78];
const FACE  = { front: 1.0, back: .66, left: .74, right: .82, top: 1.22, bottom: .52 };

/* Draw an axis-aligned box, back-face culled. */
function box(x0, x1, y0, y1, z0, z1, rgb) {
  const V = [
    [x0, y0, z0], [x1, y0, z0], [x1, y1, z0], [x0, y1, z0],
    [x0, y0, z1], [x1, y0, z1], [x1, y1, z1], [x0, y1, z1]
  ].map(v => toCam(v[0], v[1], v[2]));

  const faces = [
    { i: [0, 1, 2, 3], k: 'front',  vis: cam.z < z0, z: z0 },
    { i: [5, 4, 7, 6], k: 'back',   vis: cam.z > z1, z: z1 },
    { i: [4, 0, 3, 7], k: 'left',   vis: cam.x < x0, z: (z0 + z1) / 2 },
    { i: [1, 5, 6, 2], k: 'right',  vis: cam.x > x1, z: (z0 + z1) / 2 },
    { i: [3, 2, 6, 7], k: 'top',    vis: cam.y > y1, z: (z0 + z1) / 2 },
    { i: [4, 5, 1, 0], k: 'bottom', vis: cam.y < y0, z: (z0 + z1) / 2 }
  ];

  for (const f of faces) {
    if (!f.vis) continue;
    if (!path(f.i.map(n => V[n]))) continue;
    ctx.fillStyle = shade(rgb, FACE[f.k], Math.max(NEAR, f.z - cam.z));
    ctx.fill();
    ctx.strokeStyle = shade(rgb, FACE[f.k] * .74, Math.max(NEAR, f.z - cam.z));
    ctx.lineWidth = 1;
    ctx.stroke();
  }
}

function drawPipe(p) {
  const gapB = p.gapY - GAP / 2, gapT = p.gapY + GAP / 2;
  const x0 = -PIPE_W / 2, x1 = PIPE_W / 2;
  const z0 = p.z - PIPE_D / 2, z1 = p.z + PIPE_D / 2;
  const cx0 = x0 - CAP_OUT, cx1 = x1 + CAP_OUT;
  const cz0 = z0 - CAP_OUT, cz1 = z1 + CAP_OUT;

  box(x0, x1, FLOOR, gapB - CAP_H, z0, z1, GREEN);       // bottom body
  box(x0, x1, gapT + CAP_H, CEIL, z0, z1, GREEN);        // top body
  box(cx0, cx1, gapB - CAP_H, gapB, cz0, cz1, LIME);     // bottom lip
  box(cx0, cx1, gapT, gapT + CAP_H, cz0, cz1, LIME);     // top lip
}

/* -------------------------------------------------------------- scenery */
function drawBackground() {
  const g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, '#8b2df0');
  g.addColorStop(.5, '#7b1fdb');
  g.addColorStop(1, '#5c14a6');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, H);
}

/* Slabs are drawn as depth strips so the fog is computed per-distance
   instead of as a flat screen-space gradient. */
function drawSlab(y, rgb, mul) {
  const near = -8, far = SLAB_FOG[2], segs = 26;
  for (let i = segs - 1; i >= 0; i--) {
    const z0 = cam.z + near + (far - near) * (i / segs);
    const z1 = cam.z + near + (far - near) * ((i + 1) / segs) + 0.15;
    if (!path([toCam(-HALF_W, y, z0), toCam(HALF_W, y, z0),
               toCam(HALF_W, y, z1), toCam(-HALF_W, y, z1)])) continue;
    ctx.fillStyle = shade(rgb, mul, Math.max(NEAR, (z0 + z1) / 2 - cam.z), SLAB_FOG);
    ctx.fill();
  }
}

function drawGrid() {
  ctx.lineWidth = 1;
  const off = ((cam.z % 4) + 4) % 4;
  for (let i = 0; i < 20; i++) {
    const z = i * 4 - off + cam.z;
    const d = z - cam.z;
    if (d < NEAR) continue;
    const a = 0.16 * Math.max(0, 1 - d / SLAB_FOG[2]);
    if (a <= 0.01) continue;
    ctx.strokeStyle = 'rgba(255,255,255,' + a.toFixed(3) + ')';
    for (const y of [FLOOR + .02, CEIL - .02]) {
      if (path([toCam(-HALF_W, y, z), toCam(HALF_W, y, z),
                toCam(HALF_W, y, z + .06), toCam(-HALF_W, y, z + .06)])) ctx.stroke();
    }
  }
  for (let i = -6; i <= 6; i++) {
    const x = i * 2.2;
    ctx.strokeStyle = 'rgba(255,255,255,0.07)';
    for (const y of [FLOOR + .02, CEIL - .02]) {
      if (path([toCam(x, y, cam.z + NEAR + .1), toCam(x + .05, y, cam.z + NEAR + .1),
                toCam(x + .05, y, cam.z + SLAB_FOG[2]), toCam(x, y, cam.z + SLAB_FOG[2])])) ctx.stroke();
    }
  }
}

function drawStars() {
  for (const s of stars) {
    const c = toCam(s.x, s.y, s.z);
    if (c.z < 5) continue;
    const sx = cx + focal * c.x / c.z, sy = cy - focal * c.y / c.z;
    const sz = Math.min(7, Math.max(1, focal * s.s / c.z));
    const fade = Math.min(1, (c.z - 5) / 6) * (1 - c.z / (SPAWN_Z + 20));
    ctx.fillStyle = 'rgba(255,255,255,' + Math.max(0, 0.7 * fade).toFixed(3) + ')';
    ctx.fillRect(sx - sz / 2, sy - sz / 2, sz, sz);
  }
}

function drawScore3d(z, y) {
  const c = toCam(0, y, z);
  if (c.z < 2) return;
  const sx = cx + focal * c.x / c.z, sy = cy - focal * c.y / c.z;
  const size = focal * 3.4 / c.z;
  if (size < 6) return;
  const a = Math.max(0, Math.min(1, 1 - (c.z - 14) / 46));
  ctx.save();
  ctx.globalAlpha = a;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.font = '900 ' + size.toFixed(1) + 'px -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif';
  ctx.shadowColor = 'rgba(140,255,90,.9)';
  ctx.shadowBlur = size * .35;
  ctx.fillStyle = '#fff';
  ctx.fillText(String(score), sx, sy);
  ctx.restore();
}

/* ----------------------------------------------------------------- audio */
let ac = null;
function beep(freq, dur, type, vol) {
  try {
    if (!ac) ac = new (window.AudioContext || window.webkitAudioContext)();
    if (ac.state === 'suspended') ac.resume();
    const o = ac.createOscillator(), g = ac.createGain();
    o.type = type || 'square';
    o.frequency.setValueAtTime(freq, ac.currentTime);
    o.frequency.exponentialRampToValueAtTime(freq * .6, ac.currentTime + dur);
    g.gain.setValueAtTime(vol || .05, ac.currentTime);
    g.gain.exponentialRampToValueAtTime(.0001, ac.currentTime + dur);
    o.connect(g); g.connect(ac.destination);
    o.start(); o.stop(ac.currentTime + dur);
  } catch (e) { /* audio optional */ }
}

/* ------------------------------------------------------------------ loop */
function flap() {
  if (state === 'start') { state = 'play'; cardStart.classList.remove('show'); }
  if (state === 'dead') {
    if (t - deadAt < .55) return;      // avoid instant restart on the killing tap
    reset(); state = 'play'; cardOver.classList.remove('show'); return;
  }
  cam.vy = FLAP;
  cam.roll = (Math.random() - .5) * .12;
  beep(520, .09, 'square', .045);
}

let deadAt = -9;
function die() {
  state = 'dead'; deadAt = t; shake = 1;
  beep(160, .35, 'sawtooth', .07);
  if (score > best) {
    best = score;
    try { localStorage.setItem('flappyFpvBest', String(best)); } catch (e) { /* ignore */ }
  }
  sFinal.textContent = score;
  sBest.textContent = best;
  cardOver.classList.add('show');
}

function update(dt) {
  t += dt;

  if (state === 'start') {
    cam.y = Math.sin(t * 1.6) * .45;
    cam.pitch = Math.sin(t * 1.6) * .05;
    cam.z += 3.2 * dt;
  } else if (state === 'play') {
    speed = 12 + Math.min(score * .16, 7);
    cam.vy = Math.max(MAX_FALL, cam.vy + GRAVITY * dt);
    cam.y += cam.vy * dt;
    cam.z += speed * dt;

    if (cam.y - RADIUS < FLOOR || cam.y + RADIUS > CEIL) {
      cam.y = Math.max(FLOOR + RADIUS, Math.min(CEIL - RADIUS, cam.y));
      die();
    }
    for (const p of pipes) {
      const half = PIPE_D / 2 + CAP_OUT + RADIUS;
      if (Math.abs(p.z - cam.z) < half) {
        if (cam.y - RADIUS < p.gapY - GAP / 2 || cam.y + RADIUS > p.gapY + GAP / 2) { die(); break; }
      }
      if (!p.scored && p.z < cam.z) {
        p.scored = true; score++;
        beep(880, .08, 'triangle', .05);
      }
    }
  } else {
    cam.vy = Math.max(MAX_FALL, cam.vy + GRAVITY * 1.4 * dt);
    cam.y = Math.max(FLOOR + RADIUS, cam.y + cam.vy * dt);
    shake = Math.max(0, shake - dt * 2.5);
  }

  // smooth camera attitude
  const wantPitch = state === 'play' ? Math.max(-.34, Math.min(.26, cam.vy * .028)) : cam.pitch;
  cam.pitch += (wantPitch - cam.pitch) * Math.min(1, dt * 9);
  cam.roll  += (0 - cam.roll) * Math.min(1, dt * 5);

  // recycle
  pipes = pipes.filter(p => p.z > cam.z - 8);
  let far = cam.z;
  for (const p of pipes) far = Math.max(far, p.z);
  while (far < cam.z + SPAWN_Z) { far += SPACING; addPipe(far); }

  for (const s of stars) {
    if (s.z < cam.z - 3) { s.z = cam.z + SPAWN_Z + Math.random() * 12; s.x = (Math.random() - .5) * 30; s.y = FLOOR + Math.random() * (CEIL - FLOOR); }
  }
}

function render() {
  ctx.save();
  if (shake > 0) ctx.translate((Math.random() - .5) * 14 * shake, (Math.random() - .5) * 14 * shake);

  drawBackground();
  drawSlab(CEIL, GREEN, .62);
  drawSlab(FLOOR, GREEN, 1.05);
  drawGrid();
  drawStars();

  const sorted = pipes.slice().sort((a, b) => b.z - a.z);
  // the score floats in the gap of the pipe being flown at, so it is
  // occluded by anything nearer than that pipe
  let next = null;
  for (const p of pipes) if (p.z > cam.z + 4 && (!next || p.z < next.z)) next = p;
  for (const p of sorted) {
    if (p === next) drawScore3d(p.z + 3, p.gapY);
    drawPipe(p);
  }

  // near-camera speed vignette
  const v = ctx.createRadialGradient(cx, cy, H * .3, cx, cy, H * .78);
  v.addColorStop(0, 'rgba(0,0,0,0)');
  v.addColorStop(1, 'rgba(30,0,60,.5)');
  ctx.fillStyle = v;
  ctx.fillRect(-40, -40, W + 80, H + 80);
  ctx.restore();

  hud.textContent = state === 'play' ? score + '  ·  BEST ' + Math.max(best, score) : '';
}

function frame(ts) {
  const dt = Math.min(.05, (ts - lastTs) / 1000 || 0);
  lastTs = ts;
  update(dt);
  render();
  requestAnimationFrame(frame);
}

/* ---------------------------------------------------------------- input */
function onTap(e) { e.preventDefault(); flap(); }
cv.addEventListener('pointerdown', onTap);
document.addEventListener('touchstart', e => e.preventDefault(), { passive: false });
window.addEventListener('keydown', e => {
  if (e.code === 'Space' || e.code === 'ArrowUp' || e.code === 'Enter') { e.preventDefault(); flap(); }
});

reset();
sBest.textContent = best;
cardStart.classList.add('show');
requestAnimationFrame(ts => { lastTs = ts; requestAnimationFrame(frame); });
})();
</script>
</body>
</html>
